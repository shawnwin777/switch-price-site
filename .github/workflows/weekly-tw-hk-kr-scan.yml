# Switch 遊戲比價 — 台港韓每週自動掃描
# ============================================================================
# 目的：台港韓沒有像美歐日那樣的「遊戲清單」公開來源，只能用任天堂官方
#   價格 API 全區間掃描編號（見 scripts/scan-tw-hk-price-api.mjs）。
#   掃一次三區約 25 分鐘，Vercel 免費版單次函式跑不完（60 秒上限、12 支
#   cron 已用滿），所以搬到 GitHub Actions：repo 是公開的，Actions 免費。
#
# 排程：每週日 02:00 UTC（台北週日 10:00）跑一次；也可手動觸發
#   （Actions → Weekly TW/HK/KR scan → Run workflow）。
#   每次執行都是獨立的（runner 用完即丟、沒有跨次快取）：全量重掃＋合併＋
#   寫庫一次完成，約 3 小時（掃描放慢後；2026-11-17 實測 run #3 跑滿
#   180 分鐘上限被取消，故上限改 360 分鐘，GitHub 單一 job 上限）。
#
# 流程（與本機每週例行相同，見 SETUP.md §8.10）：
#   1. 每週新作文章收割（命名來源；失敗不中斷，合併腳本會跳過此來源）
#   2. 掃描 TW／HK／KR 主區間（70010000000000–70010000129999）
#      ＋ TW／HK ext1 新號段（70010000130000–70010000150000，2026-11 後的新編號）
#   3. 合併掃描結果＋命名來源 → data/tw-hk-full-ids.json
#   4. seed-region-ids：具名筆寫 game_region_ids（只補缺口、不覆蓋）
#   5. seed-unnamed-games：未具名筆建佔位遊戲（tw-/hk-/kr-<nsuid>）、
#      具名筆建檔／改名／合併（見 scripts/seed-unnamed-games.mjs）
#
# 不掃的區間（有意省略，見 DATA_NOTES.md §12.7）：
#   ext2（700700000xxxxx，Switch 2 Edition／升級包）與 ext3（700500000xxxxx，
#   DLC／追加內容）：這兩個空間的未具名商品會被匯入腳本跳過（疑似 DLC），
#   每週掃它們只會多花約 20 分鐘 API 請求、幾乎沒有具名收穫；有需要時
#   本機手動跑（見 SETUP.md）。KR 也只有主區間（KR DLC／S2 區間尚未掃）。
#
# Secrets（只需設定一次，見 SETUP.md §8.10）：
#   repo → Settings → Secrets and variables → Actions → New repository secret
#     SUPABASE_SERVICE_ROLE_KEY：從家裡電腦的 .env.local 複製整串貼上。
#       絕對不要在學校／共用電腦上貼這把 key（它繞過 RLS、權限最高）。
#     NEXT_PUBLIC_SUPABASE_URL：Supabase 專案 URL
#       （https://gplklnhsplydxmyepbzx.supabase.co）。
#   工作流程絕不會把這兩個值印到 log 裡（腳本只印數量與前 20 筆跳過清單）。
#
# 首次執行風險（誠實揭露）：GitHub runner 的共用 IP 可能被任天堂價格 API
#   限流（429）。掃描腳本有 429／5xx 指數退避重試（最多 5 次）；若某國
#   整批失敗，該步驟會以非零結束、GitHub 寄信通知 repo 擁有者，合併腳本
#   會因缺掃描檔而報錯（不會寫半套資料庫）。屆時手動重跑一次即可
#   （掃描支援斷點續跑，但 runner 無跨次快取，重跑是從頭全掃）。
#   2026-11-16 調查期間 15,000 次請求、價格 API 零次 429——限流目前
#   只是理論風險，不是已觀測到的問題。
# ============================================================================

name: Weekly TW/HK/KR scan

on:
  schedule:
    # 每週日 02:00 UTC（台北週日 10:00，離峰時間）
    - cron: "0 2 * * 0"
  workflow_dispatch:

permissions:
  contents: read

# 同一時間只跑一份（手動觸發撞到排程時，後到的排隊、不取消進行中的）。
concurrency:
  group: weekly-tw-hk-kr-scan
  cancel-in-progress: false

jobs:
  scan:
    name: Scan TW/HK/KR and ingest
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        # 腳本目前只用 Node 內建模組（fetch／fs），不需要 node_modules；
        # 仍安裝一次，之後腳本若引用套件才不會壞。
        run: |
          if [ -f package-lock.json ]; then
            npm ci --no-audit --no-fund
          else
            npm install --no-audit --no-fund
          fi

      - name: Harvest weekly articles (naming source, best effort)
        # 每週新作文章是命名來源之一；失敗或超時不中斷（合併腳本會跳過此來源）。
        continue-on-error: true
        run: node scripts/harvest-weekly-articles.mjs

      - name: Scan TW (main range)
        run: node scripts/scan-tw-hk-price-api.mjs --country TW

      - name: Scan HK (main range)
        run: node scripts/scan-tw-hk-price-api.mjs --country HK

      - name: Scan KR (main range)
        run: node scripts/scan-tw-hk-price-api.mjs --country KR

      - name: Scan TW ext1 (new IDs 70010000130000-150000)
        run: node scripts/scan-tw-hk-price-api.mjs --country TW --from 70010000130000 --to 70010000150000 --tag ext1

      - name: Scan HK ext1 (new IDs 70010000130000-150000)
        run: node scripts/scan-tw-hk-price-api.mjs --country HK --from 70010000130000 --to 70010000150000 --tag ext1

      - name: Merge scans into tw-hk-full-ids.json
        run: |
          set -eo pipefail
          mkdir -p logs
          node scripts/merge-scan-into-full-ids.mjs 2>&1 | tee logs/merge.log

      - name: Seed region IDs (named entries)
        run: |
          set -eo pipefail
          mkdir -p logs
          node scripts/seed-region-ids.mjs data/tw-hk-full-ids.json 2>&1 | tee logs/seed-region-ids.log

      - name: Ingest unnamed games (placeholders + name merge)
        run: |
          set -eo pipefail
          mkdir -p logs
          node scripts/seed-unnamed-games.mjs 2>&1 | tee logs/seed-unnamed-games.log

      - name: Summary
        if: always()
        run: |
          {
            echo "## 台港韓每週掃描"
            echo ""
            echo "執行時間：$(date -u '+%Y-%m-%d %H:%M UTC')"
            echo ""
            for f in logs/merge.log logs/seed-region-ids.log logs/seed-unnamed-games.log; do
              if [ -f "$f" ]; then
                echo "### $f"
                echo '```'
                grep -h "完成\|對照檔\|在售\|合併完成" "$f" | tail -20 || true
                echo '```'
                echo ""
              fi
            done
            echo "完整 log 請看本次執行的各步驟輸出。"
          } >> "$GITHUB_STEP_SUMMARY"
