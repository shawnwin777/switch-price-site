# Exact official TW metadata only. Auto mode is enabled AFTER a successful live preview.
# A daily job always rechecks all TW official prices, verifies the preview and
# applies only an identical SHA256-approved, per-row guarded update batch.
# Pushes are preview-only except this initial explicitly reviewed activation.
name: TW official title+cover guarded backfill

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/tw-official-guarded-backfill.yml'
      - 'scripts/guarded-tw-backfill.mjs'
      - 'scripts/lib/tw-official-db-patch.mjs'
      - 'scripts/lib/tw-official-catalog.mjs'
  schedule:
    # Every day 04:20 UTC / 12:20 Taipei, after official read-only source refresh
    - cron: '20 4 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'preview = DB read-only; apply = guarded production update (requires digest)'
        type: choice
        required: true
        default: preview
        options:
          - preview
          - apply
      approval_sha256:
        description: 'Exact digest from reviewed preview; required for apply'
        type: string
        required: false

permissions:
  contents: read

concurrency:
  group: tw-official-db-backfill
  cancel-in-progress: false

jobs:
  plan:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Offline safety regression tests
        run: |
          node --test tests/tw-official-backfill.test.mjs tests/tw-official-db-patch.test.mjs
          node --check scripts/guarded-tw-backfill.mjs
          node --check scripts/verify-tw-backfill-preview.mjs
      - name: Validate latest complete Taiwan official catalog with images
        run: node scripts/fetch-tw-official-index.mjs data/.cache/tw-official-index.json --force
      - name: Refresh all currently published Taiwan official game prices
        run: node scripts/scan-tw-official-prices.mjs data/.cache/tw-official-index.json reports/tw-official-prices.json
      - name: Preview exact-NSUID live TW placeholders and missing official art
        if: github.event_name != 'workflow_dispatch' || inputs.mode == 'preview'
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          node scripts/guarded-tw-backfill.mjs --index=data/.cache/tw-official-index.json --prices=reports/tw-official-prices.json --report=reports/tw-db-preview.json --max-writes=3000
      # User-approved exact TW-NSUID automation, after successful offline tests
      # and a live DB PREVIEW on the current Supabase rows. The title_en field
      # remains non-NULL as required by schema; duplicate display text is hidden.
      # Every run re-verifies
      # its SHA256 before the first write; per-row compare-and-swap prevents clobbers.
      # Ordinary pushes remain PREVIEW ONLY; approved activation marker is one-time.
      - name: Auto-apply only a fully validated and identical protected batch
        if: github.event_name == 'schedule' || (github.event_name == 'push' && contains(github.event.head_commit.message, '[tw-autofill-approved]'))
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          TW_BACKFILL_WRITE_APPROVED: YES
        run: |
          set -euo pipefail
          node scripts/verify-tw-backfill-preview.mjs reports/tw-db-preview.json
          APPROVAL_DIGEST="$(node scripts/verify-tw-backfill-preview.mjs reports/tw-db-preview.json --digest-only)"
          if [[ "$APPROVAL_DIGEST" == "NONE" ]]; then
            echo 'No safe Taiwan metadata changes; nothing to apply'
            exit 0
          fi
          node scripts/guarded-tw-backfill.mjs --index=data/.cache/tw-official-index.json --prices=reports/tw-official-prices.json --report=reports/tw-db-applied.json --max-writes=3000 --apply "--approval=$APPROVAL_DIGEST"
      # A separate manual mode is retained for fully reviewed custom runs.
      - name: Apply only the identical manually approved live plan
        if: inputs.mode == 'apply'
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          APPROVAL_SHA256: ${{ inputs.approval_sha256 }}
          TW_BACKFILL_WRITE_APPROVED: YES
        run: |
          set -euo pipefail
          if [[ ! "$APPROVAL_SHA256" =~ ^[a-f0-9]{64}$ ]]; then
            echo 'Approval digest missing or invalid' >&2
            exit 1
          fi
          node scripts/guarded-tw-backfill.mjs --index=data/.cache/tw-official-index.json --prices=reports/tw-official-prices.json --report=reports/tw-db-applied.json --max-writes=3000 --apply "--approval=$APPROVAL_SHA256"
      - name: Upload audit and rollback snapshots even on error
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tw-official-backfill-preview-or-applied
          path: |
            reports/tw-official-prices.json
            reports/tw-db-preview.json
            reports/tw-db-applied.json
          retention-days: 30
          if-no-files-found: warn
